name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: invariants-py    # the library; the apps job overrides this

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        backend: [subset, cel-expr]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,cel]'
      - name: Test
        env:
          INV_CEL_BACKEND: ${{ matrix.backend }}
          INV_REQUIRE_ENGINES: "1"
        run: python -m pytest tests -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,cel]'
          python -m mypy

  core-only:
    name: tests without the cel extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel into a fresh venv
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          /tmp/wheelcheck/bin/python -c "import invariants; print(invariants.__version__)"
          /tmp/wheelcheck/bin/inv --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: invariants-py/dist/

  apps:
    name: example apps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pool-service
        run: apps/pool-service/ci.sh
      - name: fact-pipeline
        run: apps/fact-pipeline/ci.sh
      - name: support-agent
        run: apps/support-agent/ci.sh
