# pre-commit hooks for invariants (https://pre-commit.com). `language: system` runs the `inv` installed
# in your project's environment, because `inv check` imports your app to pin its models and functions.
- id: inv-check
  name: invariants check
  description: Fail a commit that weakens a rule. When no change weakens one, re-pin invariants.lock and fail once, so the new lock is reviewed and staged.
  entry: inv check --relock --fail-on-repin
  language: system
  pass_filenames: false
  always_run: true
