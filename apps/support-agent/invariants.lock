    "PLAN-1": {
      "doc": {
        "class": "sha256:1230824546f325c07a8a4b520c378b8e0fb77e478855fcaf91272b25fa15741b",
        "mediation.chokepoint": "sha256:bf2663ebc595c07ae3865bed4c40ecccddd4d69baa0e61b581dabaea8750a7e1",
        "owner": "sha256:9769e38310b7d060269951201f71e21b86206f0d669838f5de2629d69e57ab07",
        "statement": "sha256:6c3d7bee1f3ea151fd30c6fa649941de5806c5e4408e0068847b9e2101d08fac"
      },
      "rev": null,
      "semantic": {
        "bad": [
          {"message": "the plan acts for another customer", "when": "reply.customer_id != args.customer_id"},
          {
            "message": "the plan refunds an order that does not exist",
            "when": "reply.action == \"REFUND\" && planned_order == null"
          },
          {
            "message": "the plan refunds another customer's order",
            "when": "reply.action == \"REFUND\" && planned_order != null && planned_order.customer_id != reply.customer_id"
          },
          {
            "message": "the plan refunds more than is left of the order",
            "when": "reply.action == \"REFUND\" && planned_order != null && reply.amount_cents > planned_order.remaining_cents"
          },
          {
            "message": "the plan credits more than the tier allows",
            "when": "reply.action == \"CREDIT\" && (planned_tier == null || reply.amount_cents > planned_tier.credit_limit_cents)"
          }
        ],
        "enforcers": [
          {
            "mode": "enforce",
            "on_error": "fail_closed",
            "on_violation": "escalate",
            "point": "model_call",
            "timing": "post_effect"
          },
          {
            "mode": "enforce",
            "on_error": "fail_closed",
            "on_violation": "reject",
            "point": "edge",
            "target": "py:support_agent.graph.execute_plan",
            "timing": "pre_effect"
          }
        ],
        "falsified_by": [
          "tests/test_runtime_defects.py::test_d6_an_over_refund_is_resampled_then_escalated",
          "tests/test_runtime_defects.py::test_d10_a_plan_changed_after_the_check_is_refused"
        ],
        "mediation": {"residual_paths": []},
        "model_policy": {
          "abstain": {"field": "action", "value": "ESCALATE_TO_HUMAN"},
          "feedback": {"format": "parser_error", "semantic": "none"},
          "format_retries": 2,
          "schema": "Plan",
          "semantic_resamples": 1
        },
        "scope": "call",
        "subject": {"contract": "plan", "target": "py:support_agent.planner.plan_action"}
      },
      "status": "enforce",
      "targets": ["py:support_agent.graph.execute_plan", "py:support_agent.planner.plan_action"]
    },
