  "rules": {
    "BILL-1": {
      "doc": {"statement": "sha256:8850a81a7e784d67d1f5f9cb94b42b669ae96c61c51853c8b5f2402607871ac8"},
      "rev": null,
      "semantic": {
        "bad": [
          {"message": "no such order", "when": "order == null"},
          {
            "message": "refund above what is left of the order",
            "when": "order != null && args.amount_cents > order.remaining_cents"
          }
        ],
        "enforcers": [
          {"mode": "enforce", "on_error": "fail_closed", "on_violation": "reject", "point": "decorator", "timing": "pre_effect"}
        ],
        "falsified_by": ["tests/test_runtime_defects.py::test_d6_the_door_refuses_an_over_refund_whoever_calls"],
        "subject": {"target": "py:support_agent.service.BillingService.refund"}
      },
      "status": "enforce",
      "targets": ["py:support_agent.service.BillingService.refund"]
    },
    "BILL-2": {
      "doc": {"statement": "sha256:3a21975935e60bcdb8a84433bd55b5331dc87c4f43812b81306d373775bce0bf"},
      "rev": null,
