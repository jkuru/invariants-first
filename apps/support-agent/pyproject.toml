[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "A tool-calling support agent whose API laws are checked by the invariants library."
requires-python = ">=3.11"
dependencies = [
    "invariants-first[pydantic,schema]>=0.1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
inv_rules = "invariants.yaml"
addopts = "-q -p no:cacheprovider"

[tool.invariants.scan]
roots = ["src"]
