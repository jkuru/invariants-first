[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariants-first"
version = "0.1.0"
description = "Rule-file-driven invariant guards for Python: providers, guards, model calls, edges, a CLI and a pytest plugin."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Claude"}, {name = "Gemini"}, {name = "Jerry Kuru"}]
# the three libraries are distributions of their own (../packages), released with this one
dependencies = ["pyyaml>=6", "invariants-cel==0.1.0", "invariants-scan==0.1.0", "invariants-schema-diff==0.1.0"]
keywords = ["invariants", "contracts", "cel", "guards", "llm", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Dummy URLs on example.com (reserved for examples): replace them before a release (RELEASING.md).
[project.urls]
Homepage = "https://example.com/invariants-first"
Source = "https://example.com/invariants-first/source"
Issues = "https://example.com/invariants-first/issues"
Changelog = "https://example.com/invariants-first/changelog"

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
fastapi = ["fastapi", "pydantic>=2", "httpx"]   # httpx: fastapi.testclient needs it
cel = ["invariants-cel[cel]==0.1.0"]               # the cel-expr backend (cel-expr-python, protobuf)
otel = ["opentelemetry-api>=1.20"]
anthropic = ["anthropic"]                       # integrations.anthropic.AnthropicModel (imported lazily)
schema = ["jsonschema>=4"]
dev = ["pytest>=8", "pytest-xdist>=3", "hypothesis", "httpx", "fastapi", "pydantic>=2", "jsonschema>=4", "mypy==2.4.1"]

[project.scripts]
inv = "invariants.cli:main"
inv-mcp = "invariants.mcp:main"

[project.entry-points.pytest11]
invariants = "invariants.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invariants = ["schema/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/invariants"]
# the workspace libraries, read from this checkout (an editable install of them reads the same files)
mypy_path = ["../packages/invariants-cel/src", "../packages/invariants-scan/src",
             "../packages/invariants-schema-diff/src"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cel_expr_python.*", "yaml.*", "jsonschema.*", "pytest.*", "_pytest.*", "fastapi.*",
          "pydantic.*", "opentelemetry.*", "anthropic.*", "starlette.*", "google.*"]
ignore_missing_imports = true
