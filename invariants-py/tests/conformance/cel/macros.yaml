suite: macros
cases:
- {name: exists true, expr: '[1, 2].exists(x, x > 1)', expected: violation}
- {name: exists false, expr: '[1, 2].exists(x, x > 5)', expected: ok}
- {name: exists empty, expr: '[].exists(x, x > 1)', expected: ok}
- {name: all true, expr: '[1, 2].all(x, x > 0)', expected: violation}
- {name: all false, expr: '[1, 2].all(x, x > 1)', expected: ok}
- {name: all empty, expr: '[].all(x, x > 1)', expected: violation}
- {name: exists_one, expr: '[1, 2, 3].exists_one(x, x > 2)', expected: violation}
- {name: exists_one two hits, expr: '[1, 2, 3].exists_one(x, x > 1)', expected: ok}
- {name: map, expr: '[1, 2].map(x, x * 2)', value: [2, 4]}
- {name: filter, expr: '[1, 2, 3].filter(x, x != 2)', value: [1, 3]}
- {name: map over map keys, expr: 'size({"a": 1, "b": 2}.map(k, k)) == 2 && {"a": 1, "b": 2}.map(k, k).exists(k, k == "b")', expected: violation}
- {name: all over map keys, expr: '{"a": 1}.all(k, k == "a")', expected: violation}
- {name: nested macro, expr: '[[1], [2, 3]].exists(l, l.exists(x, x == 3))', expected: violation}
- {name: macro variable shadows outer, expr: '[1].all(x, x == 1) && x == 5', env: {x: 5}, expected: violation}
- {name: macro over variable, expr: 'result.exists(s, s < 0)', env: {result: [3, -1]}, expected: violation}
- {name: macro over non-list is error, expr: 'n.exists(x, true)', env: {n: 1}, expected: rule_error}
- {name: non-bool predicate is error, expr: '[1].all(x, x)', expected: rule_error}
- {name: exists absorbs error when another element is true, expr: '[0, 1].exists(x, 1 / x > 0)', expected: violation}
- {name: all absorbs error when another element is false, expr: '[0, -1].all(x, 1 / x > 0)', expected: ok}
- {name: all with only errors and trues is error, expr: '[0, 1].all(x, 1 / x > 0)', expected: rule_error}
- {name: macro needs an identifier, expr: '[1].all(1, true)', expected: parse_error}
