[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariants-cel"
version = "0.1.0"
description = "A CEL engine for Python: a standard-library subset interpreter (cel-expr as an optional backend) and a static type check over Python annotations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Claude"}, {name = "Gemini"}, {name = "Jerry Kuru"}]
dependencies = []
keywords = ["cel", "common-expression-language", "expressions", "typecheck"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Dummy URLs on example.com (reserved for examples): replace them before a release (invariants-py/RELEASING.md).
[project.urls]
Homepage = "https://example.com/invariants-first"
Source = "https://example.com/invariants-first/source"
Issues = "https://example.com/invariants-first/issues"
Changelog = "https://example.com/invariants-first/changelog"

[project.optional-dependencies]
cel = ["cel-expr-python>=0.1.4", "protobuf>=4.21"]   # the cel-expr backend
test = ["pytest>=8", "hypothesis", "pyyaml>=6"]   # the conformance cases are YAML

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invariants_cel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/invariants_cel"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cel_expr_python.*", "google.*"]
ignore_missing_imports = true
